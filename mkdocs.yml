site_name: AI 不完全指北
site_description: 面向大一新生的 AI、Agent 与 Codex 实用指南
site_author: AI 不完全指北共建者

exclude_docs: |
  superpowers/

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  icon:
    logo: material/compass-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - 首页: index.md
  - 学习地图:
      - 第一部分：计算机第一课:
          - 总览: 01-computer/index.md
          - 计算机基础扫盲: 01-computer/计算机基础扫盲.md
          - 电子笔记: 01-computer/电子笔记.md
          - 与 AI 交互的文档格式:
              - 总览: 01-computer/与ai交互的文档格式.md
              - Markdown 语法详细教程: 01-computer/Markdown语法详细教程.md
          - 科学上网: 01-computer/科学上网.md
          - 信息搜集: 01-computer/信息搜集.md
          - CS 自学指南: 01-computer/cs自学指南.md
          - 技术论坛与电子书资源: 01-computer/技术论坛与电子书资源.md
          - 工程化技能: 01-computer/工程化技能.md
      - 第二部分：大模型与 Agent:
          - 总览: 02-ai-and-agents/index.md
          - 底层原理: 02-ai-and-agents/底层原理.md
          - 应用层: 02-ai-and-agents/应用层.md
      - 第三部分：链接合集:
          - 总览: 03-resources/index.md
          - 魔法: 03-resources/魔法.md
          - 学习资源类: 03-resources/学习资源类.md
          - 大模型与 Agent: 03-resources/大模型agent.md
          - 软件开发:
              - 总览: 03-resources/软件开发.md
              - JavaScript 与 Node.js: 03-resources/Javascript.md
          - 算法训练: 03-resources/算法训练.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/vendor/mermaid-11.12.0.min.js
  - assets/javascripts/mermaid.js
  - assets/javascripts/comments.js

extra:
  generator: false
  comments:
    repo: gghg27/ai_discuss
    repo_id: !ENV [GISCUS_REPO_ID, "R_kgDOVBFmfQ"]
    category: !ENV [GISCUS_CATEGORY, "General"]
    category_id: !ENV [GISCUS_CATEGORY_ID, "DIC_kwDOVBFmfc4DHVx1"]

copyright: 内容持续更新，请以各产品官方文档为准
